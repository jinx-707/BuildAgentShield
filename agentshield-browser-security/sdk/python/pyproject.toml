[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield-sdk"
version = "0.1.0"
description = "AgentShield AI Agent Security Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
