[project]
name = "agentshield-browser-security-api"
version = "0.1.0"
description = "Security orchestration API for AgentShield browser security"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real browser worker process",
    "e2e: real API, worker, proxy, and Chromium processes (opt in with RUN_E2E=1)",
    "load: bounded load test (opt in with RUN_E2E=1)",
]
