# A single Alembic configuration file.
[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when generating revision
# timestamps
# timezone = UTC

# max length of characters to apply to the
# "version" field
# max_version_length = 255

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_locations = alembic/versions

# version path separator
# version_path_separator = os.pathsep

# output directory for version files
# output_version_dir = alembic/versions

# the character set used for encoding source files
# source_encoding = utf-8

# sqlalchemy.url
sqlalchemy.url = driver://user:pass@dbname/host

# The version table name used by Alembic.
version_table = alembic_version

# The version column name used by Alembic.
version_column = version_num

# The version table schema name.
# version_table_schema =

# The naming style for the generated migration file
# file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See https://alembic.sqlalchemy.org/en/latest/api/runtime.html
# for more details

# format using "black" - use the console
# script runner of the same name:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
