name: agentshield-browser-security

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentshield}
      POSTGRES_USER: ${POSTGRES_USER:-agentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentshield-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/lib/postgresql/tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentshield} -d ${POSTGRES_DB:-agentshield}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8080
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentshield}:${POSTGRES_PASSWORD:-agentshield-dev-password}@postgres:5432/${POSTGRES_DB:-agentshield}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
    networks:
      - edge
      - worker-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped

  browser-worker:
    build:
      context: ./worker
    env_file:
      - .env
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 8080
      NODE_ENV: production
      REQUIRE_EGRESS_PROXY: "true"
      EGRESS_PROXY_URL: http://egress-proxy:3128
      EGRESS_PROXY_HEALTH_URL: http://egress-proxy:9090/health/ready
      BROWSER_ALLOW_PRIVATE_NETWORKS: "false"
    expose:
      - "8080"
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      - worker-net
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node/.cache:size=256m,mode=1777
      - /home/node/.config:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  egress-proxy:
    build:
      context: ./proxy
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "3128"
      PROXY_HEALTH_HOST: 0.0.0.0
      PROXY_HEALTH_PORT: "9090"
      PROXY_AUTH_TOKEN: ${PROXY_AUTH_TOKEN:-}
      PROXY_ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      PROXY_BLOCKED_DOMAINS: ${BLOCKED_DOMAINS:-}
      PROXY_DEFAULT_DOMAIN_POLICY: ${DEFAULT_DOMAIN_POLICY:-deny}
      PROXY_ALLOWED_PORTS: ${ALLOWED_PORTS:-80,443}
      PROXY_ALLOW_PRIVATE_NETWORKS: "false"
    dns:
      - ${PROXY_DNS_SERVER:-1.1.1.1}
    expose:
      - "3128"
      - "9090"
    networks:
      - worker-net
      - egress-net
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /root/.cache:size=256m,mode=1777
      - /root/.npm:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  edge:
  worker-net:
    internal: true
  egress-net:

volumes:
  postgres_data:
  redis_data:
