[project]
name = "agentshield-secure-downloads"
version = "0.1.0"
description = "Secure file-download subsystem for AgentShield Browser Security"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "clamd>=1.0.2,<2.0.0",
    "pypdf>=5.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises the real transport stack against a loopback HTTP server",
    "e2e: end-to-end acceptance scenario over a real local HTTPS transport",
    "real_clamav: requires a reachable real clamd daemon (opt-in, skipped by default)",
    "real_provider: requires a real vendor analysis endpoint (none is integrated)",
    "load: bounded local load/performance measurement (opt-in)",
    "slow: slow tests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "config*", "models*", "services*", "security*", "storage*", "integrations*"]
