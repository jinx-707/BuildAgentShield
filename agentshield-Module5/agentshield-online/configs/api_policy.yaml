# External API Connector Policy
# Unknown connectors are DENIED.

api_connectors:
  # Each connector defines full access control
  - id: "httpbin_get"
    name: "HTTPBin GET (test connector)"
    base_url: "https://httpbin.org"
    allowed_methods:
      - GET
    allowed_paths:
      - "/get"
      - "/headers"
      - "/ip"
      - "/status/{code}"
    auth_type: none
    permission_required: "api:httpbin:read"
    timeout_seconds: 15
    rate_limit_per_minute: 20
    response_size_limit_bytes: 1048576  # 1 MB

  - id: "httpbin_post"
    name: "HTTPBin POST (test connector)"
    base_url: "https://httpbin.org"
    allowed_methods:
      - POST
    allowed_paths:
      - "/post"
      - "/anything"
    auth_type: none
    permission_required: "api:httpbin:write"
    timeout_seconds: 15
    rate_limit_per_minute: 10
    response_size_limit_bytes: 1048576

  - id: "internal_mock"
    name: "Internal Mock API (test only)"
    base_url: "http://localhost:9999"
    allowed_methods:
      - GET
      - POST
    allowed_paths:
      - "/mock/*"
    auth_type: api_key
    credential_id: "MOCK_API_KEY"
    permission_required: "api:mock:all"
    timeout_seconds: 5
    rate_limit_per_minute: 100
    response_size_limit_bytes: 524288

api_defaults:
  timeout_seconds: 30
  response_size_limit_bytes: 5242880  # 5 MB
  inspect_responses: true
  sanitize_errors: true
