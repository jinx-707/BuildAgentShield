version: "3.9"

# AgentShield Offline Security Module — Development Stack
#
# Services:
#   offline-api     - The main FastAPI application
#   clamav          - ClamAV antivirus daemon
#   sandbox-runner  - Placeholder for the Docker-in-Docker sandbox (see notes)
#
# NOTE: Docker-in-Docker for the sandbox is not included here for security reasons.
# In production, the sandbox uses the host Docker socket carefully or rootless Docker.
# See docs/terminal_security.md for deployment guidance.

services:
  offline-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield-offline-api
    ports:
      - "8001:8001"
    environment:
      - AGENTSHIELD_ENVIRONMENT=development
      - AGENTSHIELD_DEBUG=false
      - AGENTSHIELD_CLAMAV_HOST=clamav
      - AGENTSHIELD_CLAMAV_PORT=3310
      - AGENTSHIELD_AUDIT_LOG_PATH=/var/log/agentshield/audit.jsonl
      - AGENTSHIELD_QUARANTINE_DIR=/var/agentshield/quarantine
      - AGENTSHIELD_DEFAULT_WORKSPACE=/workspace
      # NEVER put real secrets here — use Docker secrets or env files
    volumes:
      - ./configs:/app/configs:ro
      - agentshield-logs:/var/log/agentshield
      - agentshield-quarantine:/var/agentshield/quarantine
      - workspace-data:/workspace
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - agentshield-internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  clamav:
    image: clamav/clamav:stable
    container_name: agentshield-clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - agentshield-internal
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s  # ClamAV needs time to load virus database
    restart: unless-stopped

volumes:
  agentshield-logs:
  agentshield-quarantine:
  workspace-data:
  clamav-db:

networks:
  agentshield-internal:
    driver: bridge
    internal: false   # set to true in production to block external internet access
