# AgentShield Offline — NeMo Guardrails: Local/Heuristic Profile
#
# This profile uses only heuristic and regex-based rails.
# No external model provider is required.
# Suitable for development, CI, and environments without internet access.
#
# Activate with: AGENTSHIELD_NEMO_PROFILE=local

models: []  # No model required for heuristic rails

rails:
  input:
    flows:
      - check jailbreak
      - check input safety
  output:
    flows:
      - check output safety

# Colang flows are defined in rails.co
