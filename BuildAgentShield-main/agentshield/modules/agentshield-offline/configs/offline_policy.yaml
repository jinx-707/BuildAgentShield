# AgentShield Offline — Policy Configuration
# Controls per-agent workspace permissions and environment access.
#
# IMPORTANT: In production, replace this with Person 4's OPA policy engine.
# This file is used only by the local development policy adapter.

# ---------------------------------------------------------------------------
# Agent workspace and file permission configurations
# ---------------------------------------------------------------------------
agents:
  - agent_id: "dev-agent"
    workspace: "/workspace"
    permissions:
      read:
        - "/workspace/documents"
        - "/workspace/data"
        - "/workspace/reports"
      write:
        - "/workspace/projects"
        - "/workspace/output"
      delete: []  # delete disabled by default
    allowed_extensions: []  # empty = all extensions allowed
    denied_extensions: [".exe", ".dll", ".so", ".sh", ".bat", ".cmd", ".ps1"]
    max_file_size_bytes: 10485760  # 10 MB

  - agent_id: "analysis-agent"
    workspace: "/workspace"
    permissions:
      read:
        - "/workspace/documents"
        - "/workspace/data"
      write: []
      delete: []
    max_file_size_bytes: 52428800  # 50 MB

  - agent_id: "test-agent"
    workspace: "/tmp/test-workspace"
    permissions:
      read:
        - "/tmp/test-workspace"
      write:
        - "/tmp/test-workspace/output"
      delete:
        - "/tmp/test-workspace/output"
    max_file_size_bytes: 1048576  # 1 MB

# ---------------------------------------------------------------------------
# Environment variable access policy
# ---------------------------------------------------------------------------
environment:
  # Variables explicitly allowed (only these may be exposed to agents)
  allowlist:
    - "PYTHONPATH"
    - "TZ"
    - "LANG"
    - "LC_ALL"
    - "HOME"

  # Additional variables to deny beyond the built-in sensitive list
  denylist:
    - "NPM_TOKEN"
    - "PYPI_TOKEN"
    - "TWINE_PASSWORD"

  # Per-agent environment variable overrides
  agents:
    - agent_id: "dev-agent"
      allowed_vars:
        - "PYTHONPATH"
        - "TZ"
