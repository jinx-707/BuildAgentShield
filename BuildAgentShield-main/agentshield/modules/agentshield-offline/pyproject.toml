[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentshield-offline"
version = "0.1.0"
description = "AgentShield Offline Security Module — Person 2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AgentShield Team", email = "security@agentshield.dev" }
]
keywords = ["security", "ai-safety", "agent", "offline", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyMuPDF>=1.24.3",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.4",
    "python-pptx>=0.6.23",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "docker>=7.1.0",
    "cryptography>=42.0.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Optional NeMo Guardrails integration
# Install with: pip install -e ".[nemo]"
# NeMo requires Python 3.10-3.13 and Pydantic 2.x (already satisfied).
# NOTE: nemoguardrails has transitive deps (langchain, annoy, lark, etc.).
# The offline module works fully without this extra — NeMo is opt-in only.
nemo = [
    "nemoguardrails==0.10.1",
]
# Optional Person 1 security engine integration
# Install with: pip install -e ".[p1]"
# Requires presidio (NLP-based PII) and spacy.  After install run:
#   python -m spacy download en_core_web_lg
p1 = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
]

[project.scripts]
agentshield-offline = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = [
    "docker: marks tests requiring Docker",
    "clamav: marks tests requiring ClamAV",
    "slow: marks slow tests",
    "adversarial: marks adversarial/security tests",
    "nemo: marks tests requiring the nemoguardrails package",
    "nemo_model: marks tests requiring a live model provider (external network)",
    "p1_live: marks tests requiring the real Person 1 penetration-prevention module",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
