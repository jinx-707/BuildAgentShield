# AgentShield Offline — Sandbox & Command Execution Configuration

sandbox:
  enabled: true
  fail_closed: true                   # never fall back to host execution
  image: "python:3.11-slim"
  memory_limit: "256m"
  cpu_period: 100000
  cpu_quota: 50000                    # 50% of one CPU
  pids_limit: 64
  network_mode: "none"                # no network by default
  default_timeout_seconds: 30
  max_timeout_seconds: 300
  output_max_bytes: 1048576           # 1 MB
  user: "65534:65534"                 # nobody:nogroup
  read_only_rootfs: true
  no_new_privileges: true
  drop_all_capabilities: true
  tmpfs:
    "/tmp": "size=64m,noexec,nosuid"

command_policy:
  # Commands allowed with restricted arguments (no sandbox required)
  allowed_restricted:
    - "pwd"
    - "ls"
    - "cat"
    - "head"
    - "tail"
    - "grep"
    - "find"
    - "echo"
    - "wc"
    - "sort"
    - "uniq"
    - "cut"
    - "date"
    - "whoami"
    - "diff"

  # Commands requiring Docker sandbox
  sandbox_only:
    - "python"
    - "python3"
    - "node"
    - "npm"
    - "npx"
    - "pip"
    - "pip3"
    - "git"
    - "curl"
    - "wget"
    - "java"
    - "go"
    - "cargo"
    - "ruby"
    - "php"
    - "perl"
    - "bash"
    - "sh"
    - "zsh"

  # Always denied regardless of context
  denied:
    - "rm"
    - "rmdir"
    - "dd"
    - "mkfs"
    - "shred"
    - "kill"
    - "killall"
    - "shutdown"
    - "reboot"
    - "halt"
    - "poweroff"
    - "sudo"
    - "su"
    - "doas"
    - "pkexec"
    - "chmod"
    - "chown"
    - "chattr"
    - "iptables"
    - "ip6tables"
    - "nft"
    - "mount"
    - "umount"
    - "docker"
    - "podman"
    - "kubectl"
    - "helm"
    - "ssh"
    - "scp"
    - "sftp"
    - "rsync"
    - "nc"
    - "netcat"
    - "ncat"
    - "socat"
    - "tcpdump"
    - "wireshark"
    - "tshark"
    - "passwd"
    - "useradd"
    - "usermod"
    - "userdel"
    - "crontab"
    - "at"
    - "insmod"
    - "rmmod"
    - "modprobe"
    - "strace"
    - "ptrace"
    - "gdb"
    - "nmap"
    - "masscan"

  # Argument patterns that are always denied
  argument_blocklist_patterns:
    - "--privileged"
    - "--cap-add"
    - "/etc/"
    - "/root/"
    - "/proc/"
    - "/sys/"
    - "/dev/"
    - "/var/lib"
    - "--network"
    - "host"

  # Shell injection indicators
  shell_injection_patterns:
    - "[;&|`]"
    - "\\$\\("
    - "`"
    - "\\beval\\b"
    - "\\bexec\\b"
    - "\\x00"
