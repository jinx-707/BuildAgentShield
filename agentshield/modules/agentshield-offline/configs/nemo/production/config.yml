# AgentShield Offline — NeMo Guardrails: Production Profile
#
# Full production configuration with local inference endpoint.
# Uses a self-hosted or on-premises model to avoid data leaving the environment.
#
# Configure AGENTSHIELD_NEMO_PROFILE=production
# Set NEMO_LLM_BASE_URL to your local inference endpoint.

models:
  - type: main
    engine: openai
    model: meta/llama-3.1-8b-instruct
    parameters:
      base_url: "${NEMO_LLM_BASE_URL}"
      # api_key is read from OPENAI_API_KEY or equivalent env var

rails:
  input:
    flows:
      - check jailbreak
      - check input safety
      - self check input
  output:
    flows:
      - self check output
      - check output safety

# Colang flows are in rails.co
