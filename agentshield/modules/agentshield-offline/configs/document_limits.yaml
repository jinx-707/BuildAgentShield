# AgentShield Offline — Document Processing Limits

document_limits:
  max_file_size_bytes: 52428800       # 50 MB
  max_pages: 500
  max_text_length: 5000000            # characters
  processing_timeout_seconds: 60
  xml_entity_expansion_limit: 0       # 0 = disabled (prevents XXE)
  max_archive_entries: 1000           # for OOXML ZIP inspection
  max_expanded_archive_bytes: 104857600  # 100 MB expanded

  per_format:
    pdf:
      max_size_bytes: 52428800
      max_pages: 500
    docx:
      max_size_bytes: 20971520        # 20 MB
    xlsx:
      max_size_bytes: 20971520
      max_sheets: 100
    pptx:
      max_size_bytes: 52428800
      max_slides: 500
    txt:
      max_size_bytes: 10485760        # 10 MB
    csv:
      max_size_bytes: 10485760
    json:
      max_size_bytes: 5242880         # 5 MB
    xml:
      max_size_bytes: 10485760

malware_scanner:
  enabled: true
  fail_closed: true                   # deny if scanner unavailable
  host: "localhost"
  port: 3310
  timeout_seconds: 30

quarantine:
  enabled: true
  directory: "quarantine"
  auto_quarantine_on_malware: true
  auto_quarantine_on_injection: true
